<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <title>X-VISU</title>
  </head>
  <body>
    <main class="app">
      <h1>X-VISU</h1>
      <p>
        Welcome to X-VISU<br />
        Select an audio file to begin
      </p>
      <section class="player">
        <div class="file-row">
          <label for="audio-file" class="file-button">Choose Track</label>
          <span id="file-name">No track selected</span>
          <input id="audio-file" type="file" accept="audio/*" />
        </div>

        <audio id="audio-player"></audio>
        <div class="custom-controls">
          <button id="play-pause">▶</button>
          <span id="current-time">0:00</span>
          <input id="progress-bar" type="range" min="0" max="100" value="0" />
          <span id="duration">0:00</span>
        </div>

        <label for="volumeControl">Volume</label>
        <input
          type="range"
          id="volumeControl"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </section>

      <canvas id="visualizer"></canvas>
    </main>
    <script src="app.js"></script>
  </body>
</html>
